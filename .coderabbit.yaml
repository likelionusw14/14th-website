# yaml-language-server: $schema=https://coderabbit.ai/export/schema.json
language: "en-US"

# 리뷰 기본 설정
reviews:
  profile: "chill" # 리뷰 스타일: 'chill' (가벼운), 'assertive' (엄격한)
  request_changes_workflow: false # 리뷰에서 'Request Changes' 상태를 강제할지 여부
  high_level_summary: true # PR 요약 정보 제공
  poem: false # PR 요약에 재미있는 시를 포함 (개발자들 사이에서 소소하게 유행하는 설정입니다)
  
  # PR 봇 호출 명령어
  summary_keywords: "@coderabbitai summary"
  
  auto_title_keyword: "@coderabbitai"
  ignore_draft_pr: true # Draft PR은 리뷰하지 않음

# 챗봇 설정  
chat:
  auto_reply: true # 개발자의 코멘트에 자동으로 답변

# 특정 파일이나 경로에 대한 맞춤형 프롬프트 (필요시 주석 해제하여 사용)
